
### LOG Levels: 3=DBG, 2=INFO, 1=NOTICE, 0=WARN, -1=ERR
debug=2
log_stderror=no

memdbg=5
memlog=5

log_facility=LOG_LOCAL0
log_prefix="{$mt $hdr(CSeq) $ci} "

/* number of SIP routing processes */
children=2

/* uncomment the next line to disable TCP (default on) */
# disable_tcp=yes

/* uncomment the next line to disable the auto discovery of local aliases
 * based on reverse DNS on IPs (default on) */
# auto_aliases=no

/* add local domain aliases */
# alias="sip.mydomain.com"

/* Defining Interfaces */
#!substdef "!UDP_PORT!$env(UDP_PORT)!"

#!substdef "!CORE_IP!$env(CORE_IP)!"
#!substdef "!CORE_UDP_SOCKET!udp:CORE_IP:UDP_PORT!"
#!substdefs "!CORE_SUBNET!$env(CORE_SUBNET)!"

#!substdef "!PUBLIC_IP!$env(PUBLIC_IP)!"
#!substdef "!PUBLIC_UDP_SOCKET!udp:PUBLIC_IP:UDP_PORT!"

/* listen addresses */
listen=PUBLIC_UDP_SOCKET
listen=CORE_UDP_SOCKET